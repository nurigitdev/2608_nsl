[package]
name = "nsl-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
nsl-core = { path = "../nsl-core" }
nsl-ir = { path = "../nsl-ir" }
nsl-contract = { path = "../nsl-contract" }
nsl-write = { path = "../nsl-write" }
num-bigint = { version = "=0.4.8", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.1", default-features = false }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["test-util"] }

[lints]
workspace = true
