name: NSL v0.2 Quality and Wheel Gate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nsl-v0.2-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (Python 3.12 / Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Install development dependencies
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Verify NeX Platform cryptography baseline
        shell: pwsh
        run: .\.venv\Scripts\python.exe -c "import cryptography; print(cryptography.__version__); assert cryptography.__version__ == '46.0.7'"

      - name: Run authoritative NSL quality gate
        id: quality
        shell: pwsh
        run: .\.venv\Scripts\python.exe tools\run_quality.py

      - name: Build and verify NSL v0.2 wheel
        id: wheel
        shell: pwsh
        run: .\.venv\Scripts\python.exe tools\wheel_release.py

      - name: Record CI verification evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test | Out-Null
          @(
            "repository=${{ github.repository }}"
            "commit_sha=${{ github.sha }}"
            "ref=${{ github.ref }}"
            "workflow=${{ github.workflow }}"
            "run_id=${{ github.run_id }}"
            "run_attempt=${{ github.run_attempt }}"
            "runner_os=${{ runner.os }}"
            "quality_outcome=${{ steps.quality.outcome }}"
            "wheel_outcome=${{ steps.wheel.outcome }}"
            "python=$(& .\.venv\Scripts\python.exe --version 2>&1)"
            "cryptography=$(& .\.venv\Scripts\python.exe -c 'import cryptography; print(cryptography.__version__)' 2>&1)"
            "verified_at_utc=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
          ) | Set-Content -Path test\ci-freeze-evidence.txt -Encoding utf8

      - name: Publish verification summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## NSL v0.2 Quality and Wheel Gate

          - Commit: ${{ github.sha }}
          - Ref: ${{ github.ref }}
          - Runner: ${{ runner.os }}
          - Python: $(& .\.venv\Scripts\python.exe --version 2>&1)
          - cryptography: $(& .\.venv\Scripts\python.exe -c 'import cryptography; print(cryptography.__version__)' 2>&1)
          - Quality gate outcome: ${{ steps.quality.outcome }}
          - Wheel gate outcome: ${{ steps.wheel.outcome }}

          Authoritative command: .\.venv\Scripts\python.exe tools\run_quality.py
          Wheel command: .\.venv\Scripts\python.exe tools\wheel_release.py
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload quality-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsl-v0.2-release-evidence-${{ github.sha }}
          path: |
            test/coverage.json
            test/coverage.xml
            test/architecture_certification.json
            test/performance_acceptance.json
            test/srs_certification.json
            test/v0_2_certification.json
            test/ci-freeze-evidence.txt
            dist/nex_skill_language-0.2.1-py3-none-any.whl
            dist/nex_skill_language-0.2.1-py3-none-any.whl.sha256
          if-no-files-found: warn
          retention-days: 90

  linux-quality-gate:
    name: Quality Gate (Python 3.12 / Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Install development dependencies
        run: |
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install -r requirements-dev.txt

      - name: Verify NeX Platform cryptography baseline
        run: ./.venv/bin/python -c "import cryptography; print(cryptography.__version__); assert cryptography.__version__ == '46.0.7'"

      - name: Run authoritative NSL quality gate
        run: ./.venv/bin/python tools/run_quality.py
