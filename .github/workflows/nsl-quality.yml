name: NSL v0.1 Quality Gate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nsl-v0.1-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (Python 3.12 / Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Install development dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run authoritative NSL quality gate
        id: quality
        run: .venv/bin/python tools/run_quality.py

      - name: Record CI verification evidence
        if: always()
        shell: bash
        run: |
          mkdir -p test
          {
            echo "repository=${{ github.repository }}"
            echo "commit_sha=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "workflow=${{ github.workflow }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "runner_os=${{ runner.os }}"
            echo "quality_outcome=${{ steps.quality.outcome }}"
            echo "python=$(.venv/bin/python --version 2>&1)"
            echo "verified_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > test/ci-freeze-evidence.txt

      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NSL v0.1 Quality Gate"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- Runner: \`${{ runner.os }}\`"
            echo "- Python: \`$([ -x .venv/bin/python ] && .venv/bin/python --version 2>&1 || echo unavailable)\`"
            echo "- Quality gate outcome: \`${{ steps.quality.outcome }}\`"
            echo ""
            echo "Authoritative command: \`.venv/bin/python tools/run_quality.py\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsl-v0.1-quality-evidence-${{ github.sha }}
          path: |
            test/coverage.json
            test/coverage.xml
            test/srs_certification.json
            test/ci-freeze-evidence.txt
          if-no-files-found: warn
          retention-days: 90
